name: build-wheels

# Wheels hermes-slim needs that PyPI does not ship for one of our targets.
# Published as assets on the rolling `latest` release; hermes-slim bundle
# builds pass that release as --find-links.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cryptography-macos-x64:
    # cryptography 50.x ships no macOS x86_64 wheel, so Intel Macs build it
    # from source (needs Rust + OpenSSL headers) and the stock install fails.
    runs-on: macos-15-intel
    env:
      CRYPTOGRAPHY_VERSION: "50.0.2"
      OPENSSL_VERSION: "3.5.9"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build static OpenSSL
        run: |
          curl -fsSL -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure darwin64-x86_64-cc no-shared no-tests no-docs --prefix="$RUNNER_TEMP/ossl" --libdir=lib
          make -j"$(sysctl -n hw.ncpu)" >/dev/null
          make install_sw >/dev/null
      - name: Build wheel
        run: |
          python -m pip install -q --upgrade pip delocate
          OPENSSL_DIR="$RUNNER_TEMP/ossl" OPENSSL_STATIC=1 \
            python -m pip wheel --no-deps --no-binary cryptography -w dist "cryptography==${CRYPTOGRAPHY_VERSION}"
          ls -l dist
      - name: Verify wheel is self-contained
        run: |
          delocate-listdeps --all dist/cryptography-*.whl | tee deps.txt
          if grep -E "ssl|crypto" deps.txt | grep -v "^/usr/lib\|^/System"; then
            echo "wheel links a non-system OpenSSL"; exit 1
          fi
          python -m pip install --force-reinstall --no-deps dist/cryptography-*.whl
          python -c "from cryptography.hazmat.backends.openssl import backend; from cryptography.fernet import Fernet; Fernet(Fernet.generate_key()); print(backend.openssl_version_text())"
      - name: Publish to the `latest` release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "latest wheels" --notes "Rolling wheel cache for hermes-slim bundles."
          gh release upload latest dist/cryptography-*.whl --clobber
