name: build-wheels

# Wheels hermes-slim needs that PyPI does not ship for one of our targets.
# Published as assets on the rolling `latest` release; hermes-slim bundle
# builds pass that release as --find-links.

on:
  workflow_dispatch:
  push:
    branches: [main]
  # PRs build and verify; only main publishes.
  pull_request:

permissions:
  contents: write

jobs:
  cryptography-macos-x64:
    # cryptography 50.x ships no macOS x86_64 wheel, so Intel Macs build it
    # from source (needs Rust + OpenSSL headers) and the stock install fails.
    runs-on: macos-15-intel
    env:
      CRYPTOGRAPHY_VERSION: "50.0.2"
      OPENSSL_VERSION: "3.5.9"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build static OpenSSL
        run: |
          curl -fsSL -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure darwin64-x86_64-cc no-shared no-tests no-docs --prefix="$RUNNER_TEMP/ossl" --libdir=lib
          make -j"$(sysctl -n hw.ncpu)" >/dev/null
          make install_sw >/dev/null
      - name: Build wheel
        run: |
          python -m pip install -q --upgrade pip delocate
          OPENSSL_DIR="$RUNNER_TEMP/ossl" OPENSSL_STATIC=1 \
            python -m pip wheel --no-deps --no-binary cryptography -w dist "cryptography==${CRYPTOGRAPHY_VERSION}"
          ls -l dist
      - name: Verify wheel is self-contained
        run: |
          delocate-listdeps --all dist/cryptography-*.whl | tee deps.txt
          if grep -E "ssl|crypto" deps.txt | grep -v "^/usr/lib\|^/System"; then
            echo "wheel links a non-system OpenSSL"; exit 1
          fi
          python -m pip install cffi && python -m pip install --force-reinstall --no-deps dist/cryptography-*.whl
          python -c "from cryptography.hazmat.backends.openssl import backend; from cryptography.fernet import Fernet; Fernet(Fernet.generate_key()); print(backend.openssl_version_text())"
      - name: Publish to the `latest` release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "latest wheels" --notes "Rolling wheel cache for hermes-slim bundles."
          gh release upload latest dist/cryptography-*.whl --clobber

  win-arm64:
    # PyPI ships no win_arm64 wheel for these three (talos-hq/hermes-slim#143), so the
    # native win32-arm64 bundle (built with --no-build) cannot install them.
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGES: "cryptography==50.0.2 httptools==0.8.0 firecrawl-anydoc==0.2.4"
      VCPKG_TRIPLET: arm64-windows-static-md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: arm64
      - name: Rust (aarch64-pc-windows-msvc)
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-host aarch64-pc-windows-msvc
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - name: Static OpenSSL (vcpkg)
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path "$root\vcpkg.exe")) {
            $root = "$env:RUNNER_TEMP\vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg $root
            & "$root\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$root\vcpkg.exe" install "openssl:$env:VCPKG_TRIPLET"
          if ($LASTEXITCODE) { throw "vcpkg failed" }
          "OPENSSL_DIR=$root\installed\$env:VCPKG_TRIPLET" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OPENSSL_STATIC=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build wheels
        run: |
          python -m pip install -q --upgrade pip
          python -m pip wheel --no-deps --no-binary "cryptography,httptools,firecrawl-anydoc" -w dist $env:PACKAGES.Split(" ")
          if ($LASTEXITCODE) { throw "pip wheel failed" }
          Get-ChildItem dist
          $bad = Get-ChildItem dist -Filter *.whl | Where-Object { $_.Name -notlike "*win_arm64.whl" }
          if ($bad) { throw "not win_arm64: $($bad.Name)" }
      - name: Verify the wheels import in a clean environment
        run: |
          python -m venv "$env:RUNNER_TEMP\check"
          $py = "$env:RUNNER_TEMP\check\Scripts\python.exe"
          & $py -m pip install -q cffi
          & $py -m pip install -q --no-deps --no-index (Get-ChildItem dist -Filter *.whl).FullName
          if ($LASTEXITCODE) { throw "install failed" }
          # OpenSSL is linked statically: no OpenSSL DLL may be needed at import time.
          & $py -c "import platform; from cryptography.hazmat.backends.openssl import backend; from cryptography.fernet import Fernet; Fernet(Fernet.generate_key()); import httptools; httptools.HttpRequestParser(object()); import anydoc; print(platform.machine(), backend.openssl_version_text())"
          if ($LASTEXITCODE) { throw "import check failed" }
      - name: Publish to the `latest` release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null | Out-Null
          if ($LASTEXITCODE) { gh release create latest --title "latest wheels" --notes "Rolling wheel cache for hermes-slim bundles." }
          gh release upload latest (Get-ChildItem dist -Filter *.whl).FullName --clobber
